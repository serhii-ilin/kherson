# Pull-request checks. The Pages deploy stays on .github/workflows/deploy.yml
# and still runs only for pushes to main.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bake
      - run: npm run build
